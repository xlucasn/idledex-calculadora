name: Update idleDEX data from official Wiki

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install parser
        run: python -m pip install requests beautifulsoup4

      - name: Crawl official Wiki
        run: python scripts/update-wiki-data.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/idledex-data.json
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore: update idleDEX wiki data [skip wiki update]"
            git push
          fi
